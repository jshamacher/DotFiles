general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(181818ff)
}

input-field {
    monitor =
    size = 300, 50
    position = 0, 0
    halign = center
    valign = center

    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.20

    outer_color = rgba(606060ff)
    inner_color = rgba(202020ff)
    font_color = rgba(eeeeeeff)

    placeholder_text = <i>Password...</i>
    fail_text = <i>Authentication failed</i>
}
